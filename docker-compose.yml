services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-prod
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Postgres@2024!Secure#123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  foliar:
    build:
      context: ./foliar
      dockerfile: ./Dockerfile
    container_name: foliar-prod
    ports:
      - "5002:5000"
    environment:
      - ANTHROPIC_API_KEY=sk-ant-placeholder
      - FLASK_SECRET_KEY=1c5cbdba8d1ff68868aa990dbadf0e4645f3cbd157bd8a861d3ada3c651fea39
      - DATABASE_URL=postgresql://admin:Postgres@2024!Secure#123@postgres:5432/foliar
      - FLASK_ENV=production
      - FOLIAR_ENV=production
    volumes:
      - ./foliar/instance:/app/instance
      - ./foliar/uploads:/app/uploads
      - ./foliar/generated:/app/generated
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  maestro:
    build:
      context: ./maestro
      dockerfile: ./Dockerfile
    container_name: maestro-prod
    ports:
      - "8003:8000"
    environment:
      - ANTHROPIC_API_KEY=sk-ant-placeholder
      - JWT_SECRET=997190c7d5657240e0e4bcaf3d9ccb1eead20c850b61debbf826b729ee286ad
      - DATABASE_URL=postgresql://admin:Postgres@2024!Secure#123@postgres:5432/maestro
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - IS_PRODUCTION=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://tudominio.com
    volumes:
      - ./maestro/uploads:/app/uploads
      - ./maestro/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - foliar
      - maestro
    restart: always
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge