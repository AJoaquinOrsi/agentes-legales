<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foliar — Estudio Arrechea</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='4' fill='%2315140F'/%3E%3Cpath d='M8 6.5h8M8 6.5v11M8 12h6' stroke='%23fff' stroke-width='1.8' stroke-linecap='square'/%3E%3Ccircle cx='17' cy='17' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<style>html,body,#root{margin:0;padding:0;height:100%;background:#F7F6F2;overflow:hidden}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- ── TOKENS ── -->
<script type="text/babel">
(function(){
const foliar = {
  font: '"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
  mono: '"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace',
  canvas:'#F7F6F2', surface:'#FFFFFF', surfaceSoft:'#FBFAF6', surfaceSunken:'#F2F0EA',
  line:'#E7E3D8', lineSoft:'#EFEBE0', lineStrong:'#D5CEBC',
  ink:'#15140F', inkSoft:'#4A4740', inkMuted:'#8A8578', inkFaint:'#B3AE9E',
  accent:'#1E3A5F', accentSoft:'#2B4E7A', accentPale:'#E8EEF5', accentInk:'#0F2440',
  success:'#4A7A5A', successPale:'#EAF1EC',
  warn:'#A67A2E', warnPale:'#F6EFDE',
  danger:'#9A3B3B', dangerPale:'#F3E3E1',
  conf:{ high:'#2C5F3F', med:'#8A7318', low:'#8A3E2E' },
  shadow1:'0 1px 2px rgba(21,20,15,.04),0 0 0 1px rgba(21,20,15,.05)',
  shadow2:'0 1px 3px rgba(21,20,15,.06),0 4px 12px rgba(21,20,15,.06)',
  shadow3:'0 12px 32px rgba(21,20,15,.10),0 2px 6px rgba(21,20,15,.05)',
  radius:{xs:4,sm:6,md:8,lg:12,xl:16},
};
if (!document.getElementById('foliar-font')) {
  const lnk = document.createElement('link'); lnk.id='foliar-font'; lnk.rel='stylesheet';
  lnk.href='https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap';
  document.head.appendChild(lnk);
  const s = document.createElement('style');
  s.textContent=`.foliar-app{font-family:${foliar.font};color:${foliar.ink};font-feature-settings:"ss01","cv11"}.foliar-app *::selection{background:${foliar.accent};color:#fff}.foliar-app button{font-family:inherit}.foliar-app input,.foliar-app textarea,.foliar-app select{font-family:inherit;color:inherit}@keyframes foliar-pulse{0%,100%{opacity:1}50%{opacity:.45}}@keyframes foliar-caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}@keyframes foliar-spin{to{transform:rotate(360deg)}}@keyframes foliar-fade{from{opacity:0}to{opacity:1}}@keyframes foliar-drawer{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}`;
  document.head.appendChild(s);
}
function FoliarMark({size=22,color}){
  const c=color||foliar.ink;
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{display:'block',flexShrink:0}}><rect x="2" y="2" width="20" height="20" rx="4" fill={c}/><path d="M8 6.5h8M8 6.5v11M8 12h6" stroke="#fff" strokeWidth="1.8" strokeLinecap="square"/><circle cx="17" cy="17" r="1.6" fill="#fff"/></svg>;
}
function FoliarLogo({size=22,color,collapsed}){
  return <div style={{display:'flex',alignItems:'center',gap:10}}><FoliarMark size={size} color={color}/>{!collapsed&&<span style={{fontSize:size*.78,fontWeight:600,letterSpacing:-.4,color:color||foliar.ink}}>Foliar</span>}</div>;
}
Object.assign(window,{foliar,FoliarMark,FoliarLogo});
})();
</script>

<!-- ── PRIMITIVES ── -->
<script type="text/babel">
(function(){
const {foliar}=window;
function Button({children,variant='primary',size='md',icon,iconRight,disabled,style={},onClick,type}){
  const h=size==='sm'?30:size==='lg'?44:36, pad=size==='sm'?'0 10px':size==='lg'?'0 18px':'0 14px', fs=size==='sm'?12:size==='lg'?14:13;
  const base={display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,height:h,padding:pad,fontSize:fs,fontWeight:500,letterSpacing:-.1,borderRadius:foliar.radius.sm,border:'1px solid transparent',cursor:disabled?'default':'pointer',transition:'background .15s,border-color .15s',opacity:disabled?.5:1};
  const v={primary:{background:foliar.ink,color:'#fff',borderColor:foliar.ink},accent:{background:foliar.accent,color:'#fff',borderColor:foliar.accent},secondary:{background:foliar.surface,color:foliar.ink,borderColor:foliar.lineStrong},ghost:{background:'transparent',color:foliar.inkSoft,borderColor:'transparent'},outline:{background:'transparent',color:foliar.ink,borderColor:foliar.lineStrong}};
  return <button type={type||'button'} onClick={onClick} disabled={disabled} style={{...base,...v[variant],...style}}>{icon&&<span style={{display:'flex',opacity:.85}}>{icon}</span>}{children}{iconRight&&<span style={{display:'flex',opacity:.85}}>{iconRight}</span>}</button>;
}
function ConfidenceBar({value=0.9}){
  const c=value>=0.85?foliar.conf.high:value>=0.6?foliar.conf.med:foliar.conf.low;
  return <div style={{display:'inline-flex',alignItems:'center',gap:6,fontFamily:foliar.mono,fontSize:10,color:foliar.inkMuted}}><div style={{width:28,height:3,background:foliar.surfaceSunken,borderRadius:2,overflow:'hidden'}}><div style={{width:`${value*100}%`,height:'100%',background:c}}/></div><span style={{color:c,fontWeight:500}}>{Math.round(value*100)}</span></div>;
}
function AgentField({label,value,state='empty',confidence=0.9,mono,hint,multi}){
  const ss={empty:{bd:foliar.line,bg:foliar.surface},filling:{bd:foliar.accent,bg:foliar.surface},filled:{bd:foliar.line,bg:foliar.surface},uncertain:{bd:'#E8DCB7',bg:foliar.warnPale},edited:{bd:foliar.ink,bg:foliar.surface}};
  const s=ss[state]||ss.empty;
  return <div><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}><label style={{fontSize:11,color:foliar.inkSoft,fontWeight:500}}>{label}</label>{state==='filled'&&<ConfidenceBar value={confidence}/>}{state==='uncertain'&&<span style={{fontSize:10,color:foliar.warn,fontWeight:500}}>· revisar</span>}{state==='editing'&&<span style={{fontSize:10,color:foliar.ink,fontWeight:500}}>· editado</span>}</div><div style={{background:s.bg,border:`1px solid ${s.bd}`,borderRadius:foliar.radius.sm,padding:multi?'8px 10px':'7px 10px',minHeight:multi?54:30,fontSize:12.5,color:value?foliar.ink:foliar.inkFaint,fontFamily:mono?foliar.mono:foliar.font,boxShadow:state==='filling'?`0 0 0 3px ${foliar.accentPale}`:'none',transition:'background .2s,border-color .2s',display:'flex',alignItems:multi?'flex-start':'center'}}><span style={{whiteSpace:multi?'pre-wrap':'nowrap',overflow:'hidden',textOverflow:'ellipsis',flex:1}}>{value||<span style={{color:foliar.inkFaint}}>{hint||'—'}</span>}</span>{state==='filling'&&<span style={{display:'inline-block',width:1.5,height:14,background:foliar.accent,marginLeft:1,animation:'foliar-caret 1s infinite'}}/>}</div></div>;
}
function PdfPage({title='ANEXO I – INCAPACIDAD',highlight,style={}}){
  const sec=(lbl,rows,hi)=><div style={{border:`1px solid ${foliar.lineSoft}`,borderRadius:2,marginBottom:4}}><div style={{background:hi?'#FFF6D6':'#EEF4FA',color:'#0F2440',fontSize:8.5,fontWeight:600,padding:'3px 8px',textAlign:'center',outline:hi?`2px solid ${foliar.accent}`:'none',outlineOffset:hi?1:0,transition:'background .3s'}}>{lbl}</div><div style={{padding:'4px 8px'}}>{Array.from({length:rows}).map((_,i)=><div key={i} style={{display:'flex',gap:6,padding:'3px 0',borderBottom:i<rows-1?`1px dotted ${foliar.lineSoft}`:'none'}}><div style={{width:'40%',height:3,background:foliar.inkFaint,opacity:.5,borderRadius:1}}/><div style={{flex:1,height:3,background:foliar.inkFaint,opacity:.25,borderRadius:1}}/></div>)}</div></div>;
  return <div style={{width:'100%',height:'100%',background:'#fff',border:`1px solid ${foliar.line}`,borderRadius:2,display:'flex',flexDirection:'column',overflow:'hidden',...style}}><div style={{padding:'10px 14px',borderBottom:`1px solid ${foliar.lineSoft}`,textAlign:'center'}}><div style={{fontSize:9,fontWeight:700,letterSpacing:1,color:'#000'}}>{title}</div></div><div style={{flex:1,padding:'8px 12px',overflow:'hidden',display:'flex',flexDirection:'column'}}>{sec('Datos del trabajador',2,highlight===0)}{sec('Asistencia Letrada',3,highlight===1)}{sec('Datos del Empleador',4,highlight===2)}{sec('Contingencia',4,highlight===3)}</div><div style={{padding:'6px 12px',borderTop:`1px solid ${foliar.lineSoft}`,display:'flex',justifyContent:'space-between',fontSize:8,color:foliar.inkMuted,fontFamily:foliar.mono}}><span>pág. 1 / 3</span><span>origen.pdf</span></div></div>;
}
function Icon({path,size=14,stroke=1.6}){return <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{path}</svg>;}
const UploadIcon=(p)=><Icon {...p} path={<><path d="M8 11V3M4.5 6.5L8 3l3.5 3.5"/><path d="M2.5 12.5v1a1 1 0 001 1h9a1 1 0 001-1v-1"/></>}/>;
const PlusIcon=(p)=><Icon {...p} path={<><path d="M8 3v10M3 8h10"/></>}/>;
const ClockIcon=(p)=><Icon {...p} path={<><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></>}/>;
const CheckIcon=(p)=><Icon {...p} path={<path d="M3 8.5L6.5 12 13 4.5"/>}/>;
const ArrowIcon=(p)=><Icon {...p} path={<><path d="M3 8h10"/><path d="M9 4l4 4-4 4"/></>}/>;
const DownloadIcon=(p)=><Icon {...p} path={<><path d="M8 3v8M4.5 7.5L8 11l3.5-3.5"/><path d="M3 13h10"/></>}/>;
const SendIcon=(p)=><Icon {...p} path={<><path d="M13.5 2.5L2 7.5l4.5 1.5L8 13.5 13.5 2.5z"/><path d="M6.5 9l3-3"/></>}/>;
const SearchIcon=(p)=><Icon {...p} path={<><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></>}/>;
const FileIcon=(p)=><Icon {...p} path={<><path d="M4 2h5l3 3v9H4z"/></>}/>;
Object.assign(window,{Button,ConfidenceBar,AgentField,PdfPage,UploadIcon,PlusIcon,ClockIcon,CheckIcon,ArrowIcon,DownloadIcon,SendIcon,SearchIcon,FileIcon});
})();
</script>

<!-- ── APP ── -->
<script type="text/babel">
(function(){
const {foliar,FoliarLogo,Button,ConfidenceBar,AgentField,PdfPage,UploadIcon,PlusIcon,ClockIcon,CheckIcon,ArrowIcon,DownloadIcon,SendIcon,SearchIcon,FileIcon}=window;

const PRODUCTS={
  combo:{label:'Trámite completo',steps:['Subir documento','Procesamiento','Revisar y editar','Descargar paquete'],icon:(s=13)=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="1.5" y="3.5" width="7" height="9" rx="1"/><rect x="5" y="2" width="7" height="9" rx="1"/><rect x="8.5" y="0.5" width="7" height="9" rx="1"/></svg>},
  formulario:{label:'Formulario',steps:['Subir documento','Procesamiento','Revisar y editar','Descargar'],icon:(s=13)=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>},
  telegrama:{label:'Telegrama',steps:['Subir antecedentes','Procesamiento','Revisar texto','Despachar'],icon:(s=13)=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M2.5 4h11v8h-11z"/><path d="M2.5 4l5.5 4 5.5-4"/></svg>},
  escrito:{label:'Escrito',steps:['Subir expediente','Procesamiento','Revisar escrito','Exportar'],icon:(s=13)=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M4 1.5h6l3 3v10H4z"/><path d="M10 1.5v3h3"/><path d="M6 8h5M6 10.5h5M6 6h3"/></svg>},
};

const REVIEW_SECTIONS=[
  {title:'Datos del trabajador',keys:['Nombre y Apellido','CUIL']},
  {title:'Asistencia letrada',keys:['asistencia_nombre','asistencia_cuit','asistencia_matricula']},
  {title:'Datos del empleador',keys:['NombreRazón Social','CUIT','Localidad','Provincia','Establecimiento del lugar de efectiva prestación de servicios o donde habitualmente reporta']},
  {title:'Datos de la ART',keys:['art_nombre','art_cuit']},
  {title:'Contingencia',keys:['tipo_contingencia','fecha_denuncia','fecha_baja','fecha_ocurrencia','Detalle accidente o enfermedad profesional']},
  {title:'Afecciones',keys:['Detallá la o las afecciones o diagnósticos derivados de la contingencia']},
  {title:'Atención médica',keys:['atencion_art','alta_medica','atencion_obra_social','estudios_complementarios']},
  {title:'Comisión médica',keys:['comision_medica','fundamento_domicilio']},
];

// ── Stepper ──
function Stepper({step,product='formulario'}){
  const steps=(PRODUCTS[product]||PRODUCTS.formulario).steps;
  return <div style={{display:'flex',alignItems:'center',gap:0,fontSize:12}}>{steps.map((s,i)=>{const done=i<step,active=i===step;return <React.Fragment key={s}><div style={{display:'flex',alignItems:'center',gap:8,color:active?foliar.ink:done?foliar.inkSoft:foliar.inkMuted}}><div style={{width:20,height:20,borderRadius:10,background:done?foliar.accent:active?foliar.ink:foliar.surface,color:done||active?'#fff':foliar.inkMuted,border:`1px solid ${done?foliar.accent:active?foliar.ink:foliar.lineStrong}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:600,fontFamily:foliar.mono}}>{done?<CheckIcon size={10} stroke={2}/>:i+1}</div><span style={{fontWeight:active?500:400}}>{s}</span></div>{i<steps.length-1&&<div style={{width:28,height:1,background:done?foliar.accent:foliar.line,margin:'0 10px'}}/>}</React.Fragment>;})}</div>;
}

// ── ProductSidebar ──
function ProductSidebar({product,setProduct,go,activeLib,user,onLogout}){
  const initials=user?user.username.slice(0,2).toUpperCase():'?';
  const isVisor=user&&user.rol==='Visor';
  return <aside style={{width:220,flexShrink:0,borderRight:`1px solid ${foliar.line}`,background:foliar.surfaceSoft,display:'flex',flexDirection:'column',padding:'16px 12px'}}>
    <div style={{padding:'2px 8px 22px'}}><FoliarLogo size={20}/></div>
    {!isVisor&&<><div style={{fontSize:10,color:foliar.inkMuted,fontFamily:foliar.mono,letterSpacing:.5,textTransform:'uppercase',padding:'0 10px 8px',fontWeight:500}}>Nuevo trámite</div>
    <nav style={{display:'flex',flexDirection:'column',gap:2}}>
      {['formulario','telegrama','escrito'].map(k=>{const p=PRODUCTS[k];const on=product===k;return <div key={k} onClick={()=>{setProduct(k);go('upload');}} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:foliar.radius.sm,background:on?foliar.surface:'transparent',border:`1px solid ${on?foliar.line:'transparent'}`,boxShadow:on?foliar.shadow1:'none',cursor:'pointer',color:on?foliar.ink:foliar.inkSoft,fontSize:13,fontWeight:on?500:400}}><span style={{opacity:on?1:.6,display:'flex',color:on?foliar.accent:foliar.inkSoft}}>{p.icon(13)}</span><span>{p.label}</span>{on&&<span style={{marginLeft:'auto',width:5,height:5,borderRadius:3,background:foliar.accent}}/>}</div>;})}
      <div onClick={()=>{setProduct('combo');go('upload');}} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',marginTop:4,borderRadius:foliar.radius.sm,background:product==='combo'?foliar.ink:'transparent',border:`1px solid ${product==='combo'?foliar.ink:foliar.line}`,cursor:'pointer',color:product==='combo'?'#fff':foliar.inkSoft,fontSize:13,fontWeight:product==='combo'?500:400}}>
        <span style={{display:'flex',color:foliar.accent}}>{PRODUCTS.combo.icon(13)}</span>
        <span style={{display:'flex',flexDirection:'column',gap:1}}><span>Trámite completo</span><span style={{fontSize:9.5,fontFamily:foliar.mono,letterSpacing:.3,color:product==='combo'?'rgba(255,255,255,.65)':foliar.inkMuted,textTransform:'uppercase'}}>3 en 1</span></span>
        {product==='combo'&&<span style={{marginLeft:'auto',width:5,height:5,borderRadius:3,background:foliar.accent}}/>}
      </div>
    </nav></>}
    {isVisor&&<div style={{padding:'6px 10px 18px',fontSize:11,color:foliar.inkMuted,fontStyle:'italic'}}>Modo lectura — solo consulta</div>}
    <div style={{fontSize:10,color:foliar.inkMuted,fontFamily:foliar.mono,letterSpacing:.5,textTransform:'uppercase',padding:'22px 10px 8px',fontWeight:500}}>Biblioteca</div>
    <nav style={{display:'flex',flexDirection:'column',gap:2}}>
      {[{id:'historial',label:'Historial',icon:<ClockIcon size={13}/>},...(!isVisor&&user&&user.rol==='Admin'?[{id:'estadisticas',label:'Estadísticas',icon:<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6" y="5" width="3" height="10" rx="1"/><rect x="11" y="1" width="3" height="14" rx="1"/></svg>}]:[]),{id:'equipo',label:'Equipo',icon:<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><circle cx="6" cy="6" r="2.2"/><path d="M2.5 13c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5"/><circle cx="11.5" cy="6.5" r="1.8"/><path d="M10.2 13c0-1.5 1.3-2.8 2.8-2.8"/></svg>},...(isVisor?[]:[{id:'batch',label:'Lote',icon:<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="5" width="10" height="8" rx="1"/><path d="M3.5 5V3.5A1.5 1.5 0 015 2h8a1.5 1.5 0 011.5 1.5v8A1.5 1.5 0 0113 13H11.5"/><path d="M3.5 9h5M3.5 11.5h3"/></svg>}])].map(i=>{const on=activeLib===i.id;return <div key={i.id} onClick={()=>go(i.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:foliar.radius.sm,background:on?foliar.surface:'transparent',border:`1px solid ${on?foliar.line:'transparent'}`,cursor:'pointer',color:on?foliar.ink:foliar.inkSoft,fontSize:12.5,fontWeight:on?500:400}}><span style={{opacity:on?1:.6,display:'flex',color:on?foliar.accent:foliar.inkSoft}}>{i.icon}</span><span>{i.label}</span></div>;})}
      {user&&user.rol==='Admin'&&(()=>{const on=activeLib==='config';return <div onClick={()=>go('config')} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:foliar.radius.sm,background:on?foliar.surface:'transparent',border:`1px solid ${on?foliar.line:'transparent'}`,cursor:'pointer',color:on?foliar.ink:foliar.inkSoft,fontSize:12.5,fontWeight:on?500:400,marginTop:4}}><span style={{opacity:on?1:.6,display:'flex',color:on?foliar.accent:foliar.inkSoft}}><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.3 3.3l.85.85M11.85 11.85l.85.85M3.3 12.7l.85-.85M11.85 4.15l.85-.85"/></svg></span><span>Configuración</span></div>;})()}
    </nav>
    <div style={{flex:1}}/>
    <div style={{padding:'10px',borderTop:`1px solid ${foliar.line}`}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <div style={{width:26,height:26,borderRadius:13,background:foliar.accent,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:600}}>{initials}</div>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:11.5,color:foliar.ink,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user?user.username:'—'}</div><div style={{fontSize:10,color:foliar.inkMuted,fontFamily:foliar.mono}}>{user?user.rol||'Editor':'—'}</div></div>
      </div>
      <div style={{display:'flex',gap:6,marginTop:2}}>
        <button onClick={onLogout} style={{width:'100%',padding:'5px',background:'transparent',border:`1px solid ${foliar.line}`,borderRadius:foliar.radius.sm,fontSize:11,color:foliar.inkMuted,cursor:'pointer',fontFamily:foliar.font}}>Cerrar sesión</button>
      </div>
    </div>
  </aside>;
}

// ── Shell ──
function Shell({step,children,hideStepper,product='formulario',setProduct,go,activeLib,user,onLogout}){
  return <div style={{height:'100vh',display:'flex',background:foliar.canvas}}>
    <ProductSidebar product={product} setProduct={setProduct} go={go} activeLib={activeLib} user={user} onLogout={onLogout}/>

// ── ProcessingScreen ──
function ProcessingScreen({go,product,setProduct,combo,token,uploadedFile,setExtractedFields,setComboStatus,user,onLogout}){
  const [progress,setProgress]=React.useState(0);
  const [stage,setStage]=React.useState('Iniciando…');
  const [error,setError]=React.useState(null);
  const [elapsed,setElapsed]=React.useState(0);
  const [liveFields,setLiveFields]=React.useState([]);
  const [reconnecting,setReconnecting]=React.useState(false);
  const reconnectRef=React.useRef(0);  // contador de reconexiones fallidas
  const MAX_RECONNECTS=6;
  const isCombo=product==='combo';

  React.useEffect(()=>{
    if(!token)return;
    const es=new EventSource(`/api/stream/${token}`);
    es.onmessage=e=>{
      try{
        const msg=JSON.parse(e.data);
        // Reconexión exitosa → limpiar estado de error transitorio
        if(msg.type!=='keepalive'){reconnectRef.current=0;setReconnecting(false);}
        if(msg.type==='progress'){setProgress(msg.pct||0);setStage(msg.stage||'Procesando…');}
        if(msg.type==='field'){setLiveFields(prev=>{const next=[...prev,{label:msg.field,value:msg.value,conf:msg.confidence||0.9}];return next.slice(-8);});}
        if(msg.type==='combo_progress'){setComboStatus(s=>({...s,[msg.doc]:'processing'}));}
        if(msg.type==='combo_done'){setComboStatus(s=>({...s,[msg.doc]:'done'}));}
        if(msg.type==='done'){setExtractedFields(msg.fields||{});setComboStatus(s=>({...s,formulario:'done'}));es.close();go('review');}
        if(msg.type==='error'){setError(msg.message||'Error desconocido.');es.close();}
      }catch{}
    };
    es.onerror=()=>{
      reconnectRef.current+=1;
      if(reconnectRef.current>=MAX_RECONNECTS){
        // Demasiados intentos fallidos → error definitivo
        setError('No se pudo conectar con el servidor después de varios intentos. Verificá tu conexión a la red y volvé a intentarlo.');
        es.close();
      } else {
        // Mostrar estado de reconexión — EventSource reintenta automáticamente
        setReconnecting(true);
        // No cerrar: EventSource se reconecta solo en ~3s
      }
    };
    const et=setInterval(()=>setElapsed(x=>x+1),1000);
    return()=>{es.close();clearInterval(et);};
  },[token]);

  if(error) return <Shell step={1} product={product} setProduct={setProduct} go={go} user={user} onLogout={onLogout}>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,padding:24}}>
      <div style={{width:48,height:48,borderRadius:24,background:'#F3E3E1',display:'flex',alignItems:'center',justifyContent:'center',color:foliar.danger,fontSize:22}}>✕</div>
      <div style={{fontSize:15,fontWeight:500,color:foliar.ink,textAlign:'center',maxWidth:420}}>{error}</div>
      <div style={{fontSize:12,color:foliar.inkMuted,textAlign:'center',maxWidth:380}}>El archivo original ya no necesita volver a subirse — hacé clic en "Intentar de nuevo" para reintentar con el mismo documento.</div>
      <Button variant="primary" onClick={()=>go('upload')}>Intentar de nuevo</Button>
    </div>
  </Shell>;

  const pct=Math.round((isCombo?0.5:progress)*100);
  const stages=['Leyendo páginas y extrayendo texto','Detectando secciones y campos','Mapeando datos al formulario','Validando coherencia','Armando documento firmable'];
  const stageIdx=progress<.18?0:progress<.32?1:progress<.82?2:progress<.95?3:4;

  return <Shell step={1} product={product} setProduct={setProduct} go={go} user={user} onLogout={onLogout}>
    <div style={{flex:1,display:'grid',gridTemplateColumns:'1.1fr 1fr',minHeight:0}}>
      <div style={{padding:'32px 36px',borderRight:`1px solid ${foliar.line}`,display:'flex',flexDirection:'column'}}>
        <div style={{fontSize:11,color:foliar.accent,fontFamily:foliar.mono,letterSpacing:.3,marginBottom:6}}>Paso 2 de 4</div>
        <h1 style={{fontSize:26,fontWeight:600,letterSpacing:-.6,margin:0,color:foliar.ink}}>El agente está procesando tu documento</h1>
        <p style={{fontSize:13,color:foliar.inkSoft,marginTop:8,fontFamily:foliar.mono}}>{uploadedFile||'documento.pdf'}</p>
        {reconnecting&&<div style={{marginTop:16,padding:'10px 14px',background:'#FFF6E5',border:'1px solid #E8DCB7',borderRadius:foliar.radius.sm,display:'flex',alignItems:'center',gap:10,fontSize:12,color:foliar.warn}}>
          <span style={{width:12,height:12,borderRadius:6,border:`1.5px solid ${foliar.warn}`,borderTopColor:'transparent',animation:'foliar-spin 1s linear infinite',display:'block',flexShrink:0}}/>
          Reconectando con el servidor… ({reconnectRef.current}/{MAX_RECONNECTS})
        </div>}
        <div style={{marginTop:reconnecting?10:26,padding:'18px 20px',background:foliar.surface,border:`1px solid ${foliar.line}`,borderRadius:foliar.radius.lg}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>

// ── Gráfico de barras SVG (últimos 7 días) ───────────────────────────────────
function BarChart30({data}){
  const days=Object.keys(data||{});
  if(!days.length)return null;
  const vals=days.map(d=>data[d]||0);
  const maxVal=Math.max(...vals,1);
  const VH=60,BAR_W=14,GAP=9,PAD=4;
  const VW=days.length*(BAR_W+GAP)-GAP+PAD*2;
  return <svg viewBox={`0 0 ${VW} ${VH+20}`} width="100%" style={{overflow:'visible',display:'block'}}>
    {days.map((day,i)=>{
      const v=vals[i];
      const barH=Math.max(v/maxVal*VH,v>0?3:0);
      const x=PAD+i*(BAR_W+GAP);
      const isToday=i===days.length-1;
      const showLabel=i===0||i===days.length-1||(i%6===0);
      return <g key={day}>
        <rect x={x} y={VH-barH} width={BAR_W} height={barH||1} fill={isToday?foliar.accent:foliar.accentPale} rx={3} opacity={v===0?0.35:1}/>
        {v>0&&barH>16&&<text x={x+BAR_W/2} y={VH-barH-3} textAnchor="middle" fontSize={7.5} fill={isToday?foliar.accent:foliar.inkMuted} fontFamily={foliar.mono}>{v}</text>}
        {showLabel&&<text x={x+BAR_W/2} y={VH+13} textAnchor="middle" fontSize={8} fill={isToday?foliar.accent:foliar.inkMuted} fontFamily={foliar.mono} fontWeight={isToday?600:400}>{day}</text>}
      </g>;
    })}
  </svg>;
}

function MiniDonut({slices,size=110}){
  const total=slices.reduce((s,d)=>s+d.value,0);
  if(!total)return <div style={{color:foliar.inkMuted,fontSize:11,textAlign:'center',padding:20}}>Sin datos</div>;
  const R=size/2-6,r=R*0.58,cx=size/2,cy=size/2;
  let angle=-Math.PI/2;
  const paths=slices.filter(s=>s.value>0).map(s=>{
    const start=angle;
    const sweep=(s.value/total)*2*Math.PI;
    angle+=sweep;
    const x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start);
    const x2=cx+R*Math.cos(start+sweep),y2=cy+R*Math.sin(start+sweep);
    const ix1=cx+r*Math.cos(start+sweep),iy1=cy+r*Math.sin(start+sweep);
    const ix2=cx+r*Math.cos(start),iy2=cy+r*Math.sin(start);
    const lg=sweep>Math.PI?1:0;
    return <path key={s.label} d={`M ${x1} ${y1} A ${R} ${R} 0 ${lg} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${r} ${r} 0 ${lg} 0 ${ix2} ${iy2} Z`} fill={s.color}/>;
  });
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
    {paths}
    <text x={cx} y={cy+6} textAnchor="middle" fontSize={18} fontWeight={600} fill={foliar.ink} fontFamily={foliar.font}>{total}</text>
  </svg>;
}
