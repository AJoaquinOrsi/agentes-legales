<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foliar — Iniciar sesión</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:44px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:24px;font-weight:700;color:#1b6ca8}
.logo p{font-size:12px;color:#888;margin-top:4px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;outline:none;transition:.2s}
.field input:focus{border-color:#1b6ca8;box-shadow:0 0 0 3px rgba(27,108,168,.1)}
.submit{width:100%;padding:12px;background:#1b6ca8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.submit:hover{background:#155e96}
{% if error %}
.error-box{background:#f8d7da;color:#721c24;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;text-align:center}
{% endif %}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Foliar</h1>
    <p>Estudio Jurídico Arrechea</p>
  </div>
  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/auth/login">
    <div class="field">
      <label>Usuario o Email</label>
      <input type="text" name="identifier" placeholder="usuario o email" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit">Iniciar sesión</button>
  </form>
</div>
</body>
</html>
